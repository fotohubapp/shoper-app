<!-- ================================================================== -->
<!-- Top bar                                                             -->
<!-- ================================================================== -->
<header class="topbar" role="banner">
  <button type="button" id="nav-toggle" class="icon-btn topbar-menu" aria-expanded="false" aria-controls="sidenav">
    <svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg>
    <span class="sr-only" data-i18n="nav_open">Otwórz nawigację</span>
  </button>

  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg class="icon icon-24"><use href="#i-logo"/></svg>
    </span>
    <span class="brand-text">
      <span class="brand-name" data-i18n="app_short">FOTOhub AI</span>
      <span class="brand-store" id="store-name" data-i18n="topbar_store_unknown">Sklep niepołączony</span>
    </span>
  </div>

  <div class="topbar-right">
    <a class="credits-pill" id="credits-pill" href="https://fotohub.app/dashboard/billing" target="_blank" rel="noopener noreferrer">
      <svg class="icon" aria-hidden="true"><use href="#i-coin"/></svg>
      <span class="credits-value" id="credits-value">—</span>
      <span class="credits-unit" data-i18n="credits_unit">kr</span>
      <span class="sr-only" id="credits-sr" data-i18n="topbar_credits_aria">Dostępne kredyty FOTOhub</span>
    </a>
    <button type="button" id="lang-switch" class="text-btn" data-i18n="language_switch" data-i18n-aria-label="language_switch_aria">English</button>
    <button type="button" id="help-btn" class="icon-btn" data-i18n-aria-label="topbar_help">
      <svg class="icon" aria-hidden="true"><use href="#i-help"/></svg>
    </button>
    <button type="button" id="settings-btn" class="icon-btn" data-i18n-aria-label="topbar_settings">
      <svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg>
    </button>
  </div>
</header>

<div id="low-balance-banner" class="banner banner-warn is-hidden" role="status">
  <svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg>
  <span id="low-balance-text"></span>
  <a class="banner-link" href="https://fotohub.app/dashboard/billing" target="_blank" rel="noopener noreferrer" data-i18n="topbar_topup">Doładuj kredyty</a>
</div>

<!-- ================================================================== -->
<!-- Shell: side nav + content                                           -->
<!-- ================================================================== -->
<div class="shell">
  <div id="nav-scrim" class="nav-scrim is-hidden"></div>

  <nav id="sidenav" class="sidenav" aria-label="FOTOhub AI">
    <p class="nav-group-label" data-i18n="nav_section_work">Praca</p>
    <ul class="nav-list">
      <li><button type="button" class="nav-item" data-view="dashboard">
        <svg class="icon" aria-hidden="true"><use href="#i-dashboard"/></svg>
        <span data-i18n="nav_dashboard">Panel</span>
      </button></li>
      <li><button type="button" class="nav-item" data-view="photos">
        <svg class="icon" aria-hidden="true"><use href="#i-image"/></svg>
        <span data-i18n="nav_photos">Zdjęcia produktów</span>
      </button></li>
      <li><button type="button" class="nav-item" data-view="descriptions">
        <svg class="icon" aria-hidden="true"><use href="#i-text"/></svg>
        <span data-i18n="nav_descriptions">Opisy</span>
      </button></li>
      <li><button type="button" class="nav-item" data-view="jobs">
        <svg class="icon" aria-hidden="true"><use href="#i-jobs"/></svg>
        <span data-i18n="nav_jobs">Zadania</span>
        <span class="nav-badge is-hidden" id="nav-badge-jobs"></span>
      </button></li>
      <li><button type="button" class="nav-item" data-view="drafts">
        <svg class="icon" aria-hidden="true"><use href="#i-drafts"/></svg>
        <span data-i18n="nav_drafts">Wersje robocze</span>
        <span class="nav-badge is-hidden" id="nav-badge-drafts"></span>
      </button></li>
    </ul>

    <p class="nav-group-label" data-i18n="nav_section_config">Konfiguracja</p>
    <ul class="nav-list">
      <li><button type="button" class="nav-item" data-view="presets">
        <svg class="icon" aria-hidden="true"><use href="#i-presets"/></svg>
        <span data-i18n="nav_presets">Presety</span>
      </button></li>
      <li><button type="button" class="nav-item" data-view="settings">
        <svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg>
        <span data-i18n="nav_settings">Ustawienia</span>
      </button></li>
      <li><button type="button" class="nav-item" data-view="mcp">
        <svg class="icon" aria-hidden="true"><use href="#i-mcp"/></svg>
        <span data-i18n="nav_mcp">Asystent AI (MCP)</span>
      </button></li>
    </ul>

    <div class="nav-foot">
      <p class="nav-foot-text" data-i18n="app_subtitle"></p>
    </div>
  </nav>

  <main class="content" id="content" role="main" tabindex="-1">
    <nav class="breadcrumb" aria-label="breadcrumb">
      <ol id="breadcrumb-list">
        <li data-i18n="breadcrumb_root">FOTOhub AI</li>
      </ol>
    </nav>

    <header class="page-head">
      <div class="page-head-text">
        <h1 id="page-title">Panel</h1>
        <p id="page-subtitle" class="page-subtitle"></p>
      </div>
      <div class="page-actions" id="page-actions"></div>
    </header>

    <div id="view-root" class="view-root"></div>
  </main>
</div>

    <svg class="icon" aria-hidden="true"><use href="#i-drafts"/></svg>
    <span data-i18n="nav_drafts">Szkice</span>
    <span class="tabbar-dot is-hidden" id="tabbar-dot-drafts"></span>
  </button>
</nav>

<!-- ================================================================== -->
<!-- Overlays: toasts, dialog, popover                                   -->
<!-- ================================================================== -->
<div id="toasts" class="toasts" role="region" aria-live="polite" aria-relevant="additions"></div>

<div id="dialog-backdrop" class="dialog-backdrop is-hidden">
  <div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-body">
    <h2 class="dialog-title" id="dialog-title"></h2>
    <p class="dialog-body" id="dialog-body"></p>
    <div class="dialog-actions">
      <button type="button" class="btn" id="dialog-cancel" data-i18n="cancel">Anuluj</button>
      <button type="button" class="btn btn-primary" id="dialog-confirm" data-i18n="confirm">Potwierdź</button>
    </div>
  </div>
</div>

<div id="shortcuts-popover" class="popover is-hidden" role="dialog" aria-modal="false" aria-labelledby="shortcuts-title">
  <div class="popover-head">
    <h2 id="shortcuts-title" data-i18n="shortcuts_title">Skróty klawiszowe</h2>
    <button type="button" class="icon-btn" id="shortcuts-close" data-i18n-aria-label="close">
      <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
    </button>
  </div>
  <dl class="shortcut-list">
    <dt><kbd>A</kbd></dt><dd data-i18n="shortcut_approve">Zatwierdź pozycję</dd>
    <dt><kbd>R</kbd></dt><dd data-i18n="shortcut_reject">Odrzuć pozycję</dd>
    <dt><kbd>J</kbd></dt><dd data-i18n="shortcut_next">Następna pozycja</dd>
    <dt><kbd>K</kbd></dt><dd data-i18n="shortcut_prev">Poprzednia pozycja</dd>
    <dt><kbd>Esc</kbd></dt><dd data-i18n="shortcut_close">Zamknij okno / popover</dd>
  </dl>
</div>

<script src="app.js"></script>
</body>
</html>
